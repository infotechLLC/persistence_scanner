[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistence-scanner"
version = "0.1.0"
description = "Windows persistence triage models and ATT&CK-oriented rule helpers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "infotechLLC" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
